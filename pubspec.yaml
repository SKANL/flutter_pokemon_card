name: flutter_card_pokemon
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  bloc_concurrency: ^0.3.0
  bloc: ^9.1.0
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^16.3.0
  json_annotation: ^4.9.0
  meta: ^1.16.0
